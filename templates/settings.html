{% extends "base.html" %}
{% block title %}設定 - {{ site_name }}{% endblock %}
{% block page_id %}settings{% endblock %}
{% block content %}
<h1 class="section-title">設定</h1>

<div class="settings-box">
  <div class="settings-label">API サーバーのURL</div>
  <div class="settings-row">
    <input type="text" id="apiBaseInput" placeholder="https://your-api.example.com">
    <button id="saveApiBase">保存</button>
    <button id="resetApiBase" class="secondary">既定値に戻す</button>
  </div>
  <div class="settings-status" id="apiBaseStatus"></div>
</div>

<div class="settings-box">
  <div class="settings-label">登録チャンネル・高評価・視聴履歴について</div>
  <div class="settings-row">
    <button id="clearLocalData" class="secondary">登録・高評価・履歴をすべて削除</button>
  </div>
  <div class="settings-status" id="clearStatus"></div>
</div>

<div class="settings-box">
  <div class="settings-label">初期化(サーバー側のキャッシュを消す)</div>
  <div class="settings-row">
    <input type="password" id="serverCachePassword" placeholder="管理者パスワード">
    <button id="clearServerCache" class="secondary">初期化する</button>
  </div>
  <div class="settings-status" id="serverCacheStatus"></div>
</div>
{% endblock %}
