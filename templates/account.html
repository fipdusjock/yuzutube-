{% extends "base.html" %}
{% block title %}アカウント設定 - {{ site_name }}{% endblock %}
{% block page_id %}account{% endblock %}
{% block content %}
<h1 class="section-title">アカウント設定</h1>

<div class="page-settings-group">
  <div class="page-settings-card">
    <div class="account-icon-row">
      <div class="account-icon-preview" id="accountIconPreview">?</div>
      <div>
        <input type="file" id="accountIconInput" accept="image/*" hidden>
        <button type="button" class="page-settings-btn secondary" id="accountIconPickBtn">アイコンを選ぶ</button>
        <button type="button" class="page-settings-btn danger" id="accountIconRemoveBtn">アイコンを削除</button>
        <div class="account-icon-hint">正方形の画像のみ、50KBまで(自動で縮小・変換します)</div>
      </div>
    </div>

    <div class="account-field">
      <label for="accountDisplayName">表示名</label>
      <input type="text" id="accountDisplayName" maxlength="30" placeholder="表示名(30文字まで)">
    </div>
    <div class="account-field">
      <label for="accountUserId">ユーザーID</label>
      <input type="text" id="accountUserId" maxlength="20" placeholder="英数字とアンダースコアのみ、3〜20文字">
    </div>

    <div class="page-settings-controls">
      <button type="button" class="page-settings-btn" id="accountSaveBtn">保存</button>
    </div>
    <div class="account-status" id="accountStatus"></div>
  </div>
</div>
{% endblock %}
