{% extends "base.html" %}
{% block title %}{{ site_name }}{% endblock %}
{% block page_id %}watch{% endblock %}
{% block body_data %}data-video-id="{{ video_id }}"{% endblock %}
{% block content %}
<div class="watch-layout">
  <div>
    <div class="player-wrap" id="playerWrap">
      <div class="sk" style="width:100%; height:100%; border-radius:var(--radius);"></div>
    </div>

    <div id="videoInfo">
      <div class="sk sk-line w60" style="height:20px; margin-top:16px;"></div>
      <div class="video-owner-row">
        <div class="video-owner">
          <div class="sk sk-circle" style="width:40px;height:40px;"></div>
          <div class="sk sk-line w40" style="width:120px;"></div>
        </div>
      </div>
      <div class="sk" style="height:80px; border-radius:var(--radius); margin-top:12px;"></div>
    </div>

    <div class="comments-section">
      <div class="section-title">コメント</div>
      <div id="commentsList">
        <div class="sk sk-line w90"></div>
        <div class="sk sk-line w60"></div>
      </div>
    </div>
  </div>

  <div>
    <div class="related-list" id="relatedList">
      {% for _ in range(6) %}
      <div class="related-card">
        <div class="sk sk-thumb" style="width:168px;"></div>
        <div style="flex:1;">
          <div class="sk sk-line w90"></div>
          <div class="sk sk-line w60"></div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
{% endblock %}
