<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body data-page="{% block page_id %}{% endblock %}"
      {% block body_data %}{% endblock %}>
  <header class="top">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="メニュー">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect y="4" width="24" height="2"/><rect y="11" width="24" height="2"/><rect y="18" width="24" height="2"/></svg>
      </span>
    </button>
    <a class="logo" href="/">
      <span class="mark"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></span>
      <span class="wordmark">{{ site_name }}</span>
    </a>
    <form class="search" action="/results" method="get">
      <input type="text" name="q" placeholder="検索" value="{{ query|default('') }}">
      <button type="submit" aria-label="検索">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></span>
      </button>
    </form>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a class="item {{ 'active' if request.path == '/' else '' }}" href="/">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></span>
        <span class="label">ホーム</span>
      </a>
      <a class="item {{ 'active' if request.path == '/subscriptions' else '' }}" href="/subscriptions">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm5 4v6l6-3z"/></svg></span>
        <span class="label">登録チャンネル</span>
      </a>
      <a class="item {{ 'active' if request.path == '/history' else '' }}" href="/history">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5v4l5-4-5-4zM12 8v5l4 2-.8 1.6L11 14V8z"/></svg></span>
        <span class="label">視聴履歴</span>
      </a>
      <hr>
      <a class="item {{ 'active' if request.path == '/settings' else '' }}" href="/settings">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3a7.99 7.99 0 0 0-.25-2l2.1-1.65-2-3.46-2.48 1a8.03 8.03 0 0 0-1.73-1L16 1h-4l-.58 2.9a8.03 8.03 0 0 0-1.73 1l-2.48-1-2 3.46L7.31 9a7.99 7.99 0 0 0 0 4l-2.1 1.65 2 3.46 2.48-1c.53.43 1.11.77 1.73 1L12 21h4l.58-2.9c.62-.23 1.2-.57 1.73-1l2.48 1 2-3.46L20.69 13c.16-.65.25-1.32.25-2z"/></svg></span>
        <span class="label">設定</span>
      </a>
      <div class="hint">
        おすすめフィードはYouTubeのトレンドページから取得しています(非ログイン・非パーソナライズ)。
        登録チャンネル・高評価・履歴はこのブラウザだけに保存される仮の機能です。
      </div>
    </nav>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
