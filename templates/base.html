<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ff0033">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ site_name }}">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body data-page="{% block page_id %}{% endblock %}"
      {% block body_data %}{% endblock %}>
  <header class="top">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="メニュー">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </span>
    </button>
    <a class="logo" href="/">
      <span class="mark"><span class="icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></span></span>
      <span class="wordmark">{{ site_name }}</span>
    </a>
    <form class="search" action="/results" method="get" id="searchForm" autocomplete="off">
      <input type="text" name="q" id="searchInput" placeholder="検索" value="{{ query|default('') }}">
      <button type="submit" aria-label="検索">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg></span>
      </button>
      <div class="search-suggest" id="searchSuggest" hidden></div>
    </form>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a class="item {{ 'active' if request.path == '/' else '' }}" href="/">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h5v-6h2v6h5V10"/></svg></span>
        <span class="label">ホーム</span>
      </a>
      <a class="item {{ 'active' if request.path.startswith('/shorts') else '' }}" href="/shorts/">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="4"/><path fill="currentColor" stroke="none" d="M10.5 8.5v7l6-3.5z"/></svg></span>
        <span class="label">ショート</span>
      </a>
      <a class="item {{ 'active' if request.path == '/history' else '' }}" href="/history">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3 4.5v4.2h4.2"/><path d="M12 7.5V12l3 2"/></svg></span>
        <span class="label">視聴履歴</span>
      </a>
      <a class="item {{ 'active' if request.path == '/liked' else '' }}" href="/liked">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H3V10zM21 12l-3 9H9a2 2 0 0 1-2-2v-9l4-6a2 2 0 0 1 2 2v4h5a2 2 0 0 1 2 2z"/></svg></span>
        <span class="label">高く評価した動画</span>
      </a>
      <a class="item {{ 'active' if request.path.startswith('/my-playlists') else '' }}" href="/my-playlists">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h12M3 12h12M3 18h8"/><path d="M17 10v9l6-4.5z"/></svg></span>
        <span class="label">マイプレイリスト</span>
      </a>
      <hr>

      <div class="sidebar-section-title">登録チャンネル</div>
      <div id="sidebarSubs"></div>
      <button type="button" class="item sidebar-more-btn" id="sidebarSubsMoreBtn" hidden>
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        <span class="label">もっと見る</span>
      </button>
      <a class="item {{ 'active' if request.path == '/subscriptions' else '' }}" href="/subscriptions" id="sidebarSubsAllLink" hidden>
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path fill="currentColor" stroke="none" d="M10.3 9.3v5.4l4.7-2.7z"/></svg></span>
        <span class="label">すべて見る</span>
      </a>
      <div class="sidebar-empty-hint" id="sidebarSubsEmpty">登録チャンネルはまだありません</div>
      <hr>

      <div class="sidebar-section-title">マイページ</div>
      <a class="item {{ 'active' if request.path == '/account' else '' }}" href="/account">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></span>
        <span class="label">アカウント設定</span>
      </a>
      <a class="item {{ 'active' if request.path == '/settings' else '' }}" href="/settings">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg></span>
        <span class="label">設定</span>
      </a>
      <a class="item {{ 'active' if request.path.startswith('/inquiries') else '' }}" href="/inquiries">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <span class="label">お問い合わせ</span>
      </a>
      <a class="item {{ 'active' if request.path == '/admin/moderation' else '' }}" href="/admin/moderation" id="adminModerationLink" hidden>
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6z"/></svg></span>
        <span class="label">モデレーション管理</span>
      </a>
      <a class="item {{ 'active' if request.path == '/changelog' else '' }}" href="/changelog">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg></span>
        <span class="label">更新履歴</span>
      </a>
      <a class="item {{ 'active' if request.path == '/terms' else '' }}" href="/terms">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></span>
        <span class="label">利用規約</span>
      </a>
      <div class="sidebar-visit-count" id="sidebarVisitCount"></div>
    </nav>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
