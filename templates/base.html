<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body data-page="{% block page_id %}{% endblock %}"
      {% block body_data %}{% endblock %}>
  <header class="top">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="メニュー">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect y="4" width="24" height="2"/><rect y="11" width="24" height="2"/><rect y="18" width="24" height="2"/></svg>
      </span>
    </button>
    <a class="logo" href="/">
      <span class="mark"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></span>
      <span class="wordmark">{{ site_name }}</span>
    </a>
    <form class="search" action="/results" method="get">
      <input type="text" name="q" placeholder="検索" value="{{ query|default('') }}">
      <button type="submit" aria-label="検索">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></span>
      </button>
    </form>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a class="item active" href="/">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></span>
        <span class="label">ホーム</span>
      </a>
      <hr>
      <div class="hint">
        おすすめフィードはありません。検索するか、動画URL/IDを直接入力してください。
      </div>
    </nav>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
