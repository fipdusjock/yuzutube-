{% extends "base.html" %}
{% block title %}{{ site_name }}{% endblock %}
{% block page_id %}channel{% endblock %}
{% block body_data %}data-channel-id="{{ channel_id }}"{% endblock %}
{% block content %}
<div id="channelHeader">
  <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
    <div class="sk sk-circle" style="width:64px;height:64px;"></div>
    <div style="flex:1; max-width:240px;">
      <div class="sk sk-line w90" style="height:18px;"></div>
      <div class="sk sk-line w40"></div>
    </div>
  </div>
</div>
<div class="grid" id="channelGrid">
  {% for _ in range(12) %}
  <div class="card sk-card">
    <div class="sk sk-thumb"></div>
    <div class="meta">
      <div style="flex:1;">
        <div class="sk sk-line w90"></div>
        <div class="sk sk-line w40"></div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
