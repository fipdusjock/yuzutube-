<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - {{ site_name }}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="auth-brand" href="/login">
      <span class="auth-brand-mark">柚</span>
      <span class="auth-brand-name">{{ site_name }}</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">ログイン</h1>
      <p class="auth-sub">続けるにはログインしてください</p>

      <form class="auth-form" id="loginForm" novalidate>
        <label class="auth-field">
          <span>メールアドレス</span>
          <input type="email" name="email" id="email" autocomplete="email" required placeholder="you@example.com">
        </label>
        <label class="auth-field">
          <span>パスワード</span>
          <input type="password" name="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </label>

        <div class="auth-error" id="authError" hidden></div>

        <button type="submit" class="auth-submit" id="submitBtn">
          <span class="auth-submit-label">ログイン</span>
        </button>
      </form>

      <div class="auth-switch">
        アカウントをお持ちでない方は <a href="/signup">新規登録</a>
      </div>
    </div>
  </main>

<script>
const form = document.getElementById("loginForm");
const errorBox = document.getElementById("authError");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  submitBtn.disabled = true;
  submitBtn.classList.add("loading");

  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      throw new Error(data.message || "ログインに失敗しました");
    }
    window.location.href = "/";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.hidden = false;
    submitBtn.disabled = false;
    submitBtn.classList.remove("loading");
  }
});
</script>
</body>
</html>
