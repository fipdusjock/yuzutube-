{% extends "base.html" %}
{% block title %}{{ query }} - {{ site_name }}{% endblock %}
{% block page_id %}results{% endblock %}
{% block body_data %}data-query="{{ query }}"{% endblock %}
{% block content %}
<h1 class="section-title">「{{ query }}」の検索結果</h1>
<div class="search-filters" id="searchFilters"></div>
<div class="grid" id="resultsGrid">
  {% for _ in range(12) %}
  <div class="card sk-card">
    <div class="sk sk-thumb"></div>
    <div class="meta">
      <div class="sk sk-circle"></div>
      <div style="flex:1;">
        <div class="sk sk-line w90"></div>
        <div class="sk sk-line w40"></div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
