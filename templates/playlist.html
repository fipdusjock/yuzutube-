{% extends "base.html" %}
{% block title %}{{ site_name }}{% endblock %}
{% block page_id %}playlist{% endblock %}
{% block body_data %}data-playlist-id="{{ playlist_id }}"{% endblock %}
{% block content %}
<div id="playlistHeader">
  <div class="sk sk-line w60" style="height:20px;"></div>
  <div class="sk sk-line w40" style="margin-bottom:24px;"></div>
</div>
<div class="grid" id="playlistGrid">
  {% for _ in range(12) %}
  <div class="card sk-card">
    <div class="sk sk-thumb"></div>
    <div class="meta">
      <div style="flex:1;">
        <div class="sk sk-line w90"></div>
        <div class="sk sk-line w40"></div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
