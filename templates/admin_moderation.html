{% extends "base.html" %}
{% block title %}モデレーション管理 - {{ site_name }}{% endblock %}
{% block page_id %}admin_moderation{% endblock %}
{% block content %}
<h1 class="section-title">モデレーション管理</h1>
<div class="account-status" id="adminAccessStatus"></div>

<div id="adminModerationBody" hidden>
  <div class="page-settings-group">
    <div class="page-settings-group-title">NGワード</div>
    <div class="page-settings-card">
      <div class="account-field">
        <label for="ngWordInput">単語を1つ追加</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="ngWordInput" placeholder="NGワード" style="flex:1;">
          <button type="button" class="page-settings-btn" id="ngWordAddBtn">追加</button>
        </div>
      </div>
      <div class="account-field">
        <label for="ngWordBulkInput">まとめて追加(改行またはカンマ区切り)</label>
        <textarea id="ngWordBulkInput" rows="4" placeholder="単語1&#10;単語2&#10;単語3"></textarea>
        <div class="page-settings-controls" style="margin-top:8px;">
          <button type="button" class="page-settings-btn secondary" id="ngWordBulkAddBtn">まとめて追加</button>
        </div>
      </div>
      <div class="account-field">
        <label for="ngWordUrlInput">URLから一括インポート(改行区切りの単語一覧が置いてあるURL)</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="ngWordUrlInput" placeholder="https://raw.githubusercontent.com/..." style="flex:1;">
          <button type="button" class="page-settings-btn secondary" id="ngWordUrlImportBtn">インポート</button>
        </div>
      </div>
      <div class="account-status" id="ngWordStatus"></div>
      <div id="ngWordList" class="ng-word-list"></div>
    </div>
  </div>

  <div class="page-settings-group">
    <div class="page-settings-group-title">IPアドレスの手動BAN</div>
    <div class="page-settings-card">
      <div class="account-field">
        <label for="manualBanIpInput">IPアドレス</label>
        <input type="text" id="manualBanIpInput" placeholder="例: 1.2.3.4">
      </div>
      <div class="account-field">
        <label for="manualBanReasonInput">理由(任意)</label>
        <input type="text" id="manualBanReasonInput" placeholder="理由">
      </div>
      <div class="page-settings-controls">
        <button type="button" class="page-settings-btn danger" id="manualBanBtn">BANする</button>
      </div>
      <div class="account-status" id="manualBanStatus"></div>
    </div>
  </div>

  <div class="page-settings-group">
    <div class="page-settings-group-title">BAN中のIP一覧</div>
    <div class="page-settings-card">
      <div id="bannedIpsList" class="banned-ips-list"></div>
    </div>
  </div>

  <div class="page-settings-group">
    <div class="page-settings-group-title">BANログの確認(誤BANのチェック用)</div>
    <div class="page-settings-card">
      <div class="account-field">
        <div style="display:flex; gap:8px;">
          <input type="text" id="banLogFilterInput" placeholder="IPアドレスまたはメールアドレスで絞り込み">
          <button type="button" class="page-settings-btn secondary" id="banLogFilterBtn">検索</button>
          <button type="button" class="page-settings-btn secondary" id="banLogClearBtn">クリア</button>
        </div>
      </div>
      <div id="banEventsList" class="ban-events-list"></div>
    </div>
  </div>
</div>
{% endblock %}
