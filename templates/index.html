{% extends "base.html" %}
{% block title %}{{ site_name }}{% endblock %}
{% block page_id %}index{% endblock %}
{% block content %}
<div class="landing">
  <div class="logo">
    <span class="mark"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></span>
    {{ site_name }}
  </div>
  <p>おすすめフィードは無いので、まずは検索するか、動画URL/IDを直接開いてください。</p>

  <form class="search" action="/results" method="get">
    <input type="text" name="q" placeholder="動画・チャンネルを検索">
    <button type="submit">検索</button>
  </form>

  <form class="direct-open" action="/watch" method="get">
    <input type="text" name="v" placeholder="動画IDまたはURL (例: dQw4w9WgXcQ)">
    <button type="submit">開く</button>
  </form>
</div>
{% endblock %}
