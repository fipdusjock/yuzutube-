{% extends "base.html" %}
{% block title %}{{ site_name }}{% endblock %}
{% block page_id %}index{% endblock %}
{% block content %}
<div class="trending-header">
  <div class="trending-tabs" id="trendingTabs">
    <button type="button" class="trending-tab-btn active" data-category="trending">急上昇</button>
    <button type="button" class="trending-tab-btn" data-category="music">音楽</button>
    <button type="button" class="trending-tab-btn" data-category="gaming">ゲーム</button>
  </div>
  <div class="trending-updated" id="trendingUpdated"></div>
</div>
<div class="grid" id="trendingGrid">
  {% for _ in range(12) %}
  <div class="card sk-card">
    <div class="sk sk-thumb"></div>
    <div class="meta">
      <div class="sk sk-circle"></div>
      <div style="flex:1;">
        <div class="sk sk-line w90"></div>
        <div class="sk sk-line w40"></div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
